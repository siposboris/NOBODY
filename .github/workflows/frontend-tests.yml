name: Nobody frontend tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Build native Rust CLI
        run: cargo build --locked --manifest-path rust/Cargo.toml --bin nobody-rs
      - name: Run migrated lexer, parser and numbered-error regressions in Rust
        run: |
          cargo test --locked --manifest-path rust/Cargo.toml --test lexer_legacy_migration
          cargo test --locked --manifest-path rust/Cargo.toml --test parser_legacy_migration
          cargo test --locked --manifest-path rust/Cargo.toml --test numbered_errors_legacy_migration
          cargo test --locked --manifest-path rust/Cargo.toml --test bidi_legacy_migration
          cargo test --locked --manifest-path rust/Cargo.toml --test return_types_legacy_migration
      - name: Run remaining Python frontend suites
        run: |
          python -m unittest discover -s tests -p 'test_native_scripts.py' -v
          python -m unittest discover -s tests -p 'test_013_catalog_vm.py' -v
          python -m unittest discover -s tests -p 'test_013_profile_validator.py' -v
          python -m unittest discover -s tests -p 'test_014.py' -v
          python -m unittest discover -s tests -p 'test_015.py' -v
          python -m unittest discover -s tests -p 'test_016_ast_format.py' -v
          python -m unittest discover -s tests -p 'test_017_scopes.py' -v
          python -m unittest discover -s tests -p 'test_018_static_types.py' -v
          python -m unittest discover -s tests -p 'test_019_flow_types.py' -v
          python -m unittest discover -s tests -p 'test_021_return_types.py' -v
      - name: Native Rust CLI compatibility smoke
        run: |
          set -euo pipefail
          cli=rust/target/debug/nobody-rs
          "$cli" errors 1001
          "$cli" type-check examples/hello_sk.nbd --lang sk
          "$cli" ast-json examples/hello_sk.nbd --lang sk > /dev/null
          "$cli" translate examples/hello_sk.nbd --from-lang sk --to ai > /dev/null
          "$cli" audit-languages
          "$cli" info
          "$cli" languages --json > /dev/null
          "$cli" ast-run examples/hello_sk.nbd --lang sk
