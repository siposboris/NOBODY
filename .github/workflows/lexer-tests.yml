name: Nobody lexer tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lexer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Verify Rust lexer regression suite
        run: |
          cargo fmt --manifest-path rust/Cargo.toml --all -- --check
          cargo test --locked --manifest-path rust/Cargo.toml --test lexer_legacy_migration
