name: Nobody lexer tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lexer:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify independent lexer tests
        run: python -m unittest discover -s tests -p 'test_lexer.py' -v
