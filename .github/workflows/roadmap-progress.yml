name: Nobody roadmap progress

on:
  pull_request:
    paths:
      - 'README.md'
      - 'docs/ROADMAP.md'
      - 'scripts/update-roadmap-progress.py'
      - '.github/workflows/roadmap-progress.yml'
  push:
    paths:
      - 'README.md'
      - 'docs/ROADMAP.md'
      - 'scripts/update-roadmap-progress.py'
      - '.github/workflows/roadmap-progress.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-readme-progress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate README roadmap progress
        run: python3 scripts/update-roadmap-progress.py --check
