name: Nobody roadmap progress

on:
  pull_request:
    paths:
      - 'README.md'
      - 'docs/ROADMAP.md'
      - 'rust/src/bin/nobody-roadmap.rs'
      - 'rust/Cargo.toml'
      - 'rust/Cargo.lock'
      - '.github/workflows/roadmap-progress.yml'
  push:
    paths:
      - 'README.md'
      - 'docs/ROADMAP.md'
      - 'rust/src/bin/nobody-roadmap.rs'
      - 'rust/Cargo.toml'
      - 'rust/Cargo.lock'
      - '.github/workflows/roadmap-progress.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-readme-progress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate README roadmap progress with Rust
        run: cargo run --locked --quiet --manifest-path rust/Cargo.toml --bin nobody-roadmap -- --check
