name: Nobody Rust formatting repair

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply canonical Rust formatting
        run: cargo fmt --manifest-path rust/Cargo.toml --all
      - name: Check formatted diff for whitespace errors
        run: git diff --check
      - name: Commit formatted Rust sources if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- rust/; then
            echo "Rust sources already match rustfmt."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- rust/
          git commit -m "style(rust): apply rustfmt to all Rust sources"
          git push origin HEAD:main
      - name: Verify committed Rust formatting
        run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check
