name: Nobody Rust frontend

on:
  push:
    paths:
      - 'rust/**'
      - '.github/workflows/rust.yml'
  pull_request:
    paths:
      - 'rust/**'
      - '.github/workflows/rust.yml'

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Format verification
        run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check
      - name: Compile and unit tests
        run: cargo test --manifest-path rust/Cargo.toml --all-targets --locked
      - name: Clippy
        run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings
      - name: CLI smoke
        run: cargo run --manifest-path rust/Cargo.toml -- lex examples/hello_sk.nbd
