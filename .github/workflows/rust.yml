name: Nobody Rust frontend

on:
  workflow_dispatch:
  push:
    paths:
      - 'rust/**'
      - '.github/workflows/rust.yml'
      - 'scripts/verify-rust.sh'
  pull_request:
    paths:
      - 'rust/**'
      - '.github/workflows/rust.yml'
      - 'scripts/verify-rust.sh'

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Toolchain versions
        run: |
          rustc --version
          cargo --version
          rustfmt --version
          cargo clippy --version
      - name: Generate reproducible dependency lock snapshot
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile --manifest-path rust/Cargo.toml
          printf '%s\n' 'NOBODY_LOCK_BEGIN'
          cat rust/Cargo.lock
          printf '%s\n' 'NOBODY_LOCK_END'
      - name: Unified Rust verification gate
        run: |
          set -o pipefail
          bash scripts/verify-rust.sh 2>&1 | tee rust-verification.log
      - name: Upload Rust verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nobody-rust-verification
          path: rust-verification.log
          if-no-files-found: warn
          retention-days: 14
      - name: Format Rust sources
        run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check
      - name: Compile and unit tests
        run: cargo test --manifest-path rust/Cargo.toml --all-targets
      - name: Clippy
        run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings
      - name: CLI lex and parser subset smoke
        run: |
          cargo run --manifest-path rust/Cargo.toml -- lex rust/examples/basic_sk.nbd
          cargo run --manifest-path rust/Cargo.toml -- parse sk rust/examples/basic_sk.nbd
          cargo run --manifest-path rust/Cargo.toml -- parse en rust/examples/basic_en.nbd
          cargo run --manifest-path rust/Cargo.toml -- parse ai rust/examples/basic_ai.nbd
          cargo run --manifest-path rust/Cargo.toml -- parse sk examples/hello_sk.nbd
          cargo run --manifest-path rust/Cargo.toml -- parse ai examples/hello_ai.nbd
          cargo run --manifest-path rust/Cargo.toml -- validate sk examples/hello_sk.nbd
          cargo run --manifest-path rust/Cargo.toml -- validate ai examples/hello_ai.nbd
      - name: All 40 syntax profiles and AI migration smoke
        run: |
          cargo run --manifest-path rust/Cargo.toml -- list-languages
          cargo run --manifest-path rust/Cargo.toml -- translate sk ai examples/hello_sk.nbd > /tmp/translated_ai.nbd
          cargo run --manifest-path rust/Cargo.toml -- validate ai /tmp/translated_ai.nbd
          cargo run --manifest-path rust/Cargo.toml -- migrate-ai examples/hello_ai_legacy.nbd > /tmp/migrated_ai.nbd
          cargo run --manifest-path rust/Cargo.toml -- validate ai /tmp/migrated_ai.nbd

      - name: Canonical IR v1 and structural comparison smoke
        run: |
          cargo run --manifest-path rust/Cargo.toml -- ir sk rust/examples/basic_sk.nbd
          cargo run --manifest-path rust/Cargo.toml -- ir ai examples/hello_ai.nbd
          cargo run --manifest-path rust/Cargo.toml -- compare-ir sk rust/examples/basic_sk.nbd en rust/examples/ir_match_en.nbd

      - name: Rust static type checker smoke
        run: |
          cargo run --manifest-path rust/Cargo.toml -- typecheck ai rust/examples/typecheck_good_ai.nbd
          if cargo run --manifest-path rust/Cargo.toml -- typecheck ai rust/examples/typecheck_bad_ai.nbd; then
            echo "Expected N1001 rejection, but typecheck succeeded" >&2
            exit 1
          fi

      - name: Known function arity (N1005)
        run: |
          cargo run --manifest-path rust/Cargo.toml -- typecheck ai rust/examples/arity_good_ai.nbd
          if cargo run --manifest-path rust/Cargo.toml -- typecheck ai rust/examples/arity_bad_ai.nbd; then
            echo "Expected N1005 arity rejection" >&2
            exit 1
          fi

