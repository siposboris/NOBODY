name: Nobody Rust frontend

on:
  push:
    paths:
      - 'rust/**'
      - '.github/workflows/rust.yml'
  pull_request:
    paths:
      - 'rust/**'
      - '.github/workflows/rust.yml'

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Format Rust sources
        run: cargo fmt --manifest-path rust/Cargo.toml --all
      - name: Compile and unit tests
        run: cargo test --manifest-path rust/Cargo.toml --all-targets
      - name: Clippy
        run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings
      - name: CLI lex and parser subset smoke
        run: |
          cargo run --manifest-path rust/Cargo.toml -- lex rust/examples/basic_sk.nbd
          cargo run --manifest-path rust/Cargo.toml -- parse sk rust/examples/basic_sk.nbd
          cargo run --manifest-path rust/Cargo.toml -- parse en rust/examples/basic_en.nbd
          cargo run --manifest-path rust/Cargo.toml -- parse ai rust/examples/basic_ai.nbd
          cargo run --manifest-path rust/Cargo.toml -- parse sk examples/hello_sk.nbd
          cargo run --manifest-path rust/Cargo.toml -- parse ai examples/hello_ai.nbd
          cargo run --manifest-path rust/Cargo.toml -- validate sk examples/hello_sk.nbd
          cargo run --manifest-path rust/Cargo.toml -- validate ai examples/hello_ai.nbd
      - name: All 40 syntax profiles and AI migration smoke
        run: |
          cargo run --manifest-path rust/Cargo.toml -- list-languages
          cargo run --manifest-path rust/Cargo.toml -- translate sk ai examples/hello_sk.nbd > /tmp/translated_ai.nbd
          cargo run --manifest-path rust/Cargo.toml -- validate ai /tmp/translated_ai.nbd
          cargo run --manifest-path rust/Cargo.toml -- migrate-ai examples/hello_ai_legacy.nbd > /tmp/migrated_ai.nbd
          cargo run --manifest-path rust/Cargo.toml -- validate ai /tmp/migrated_ai.nbd
