<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Nobody programming language logo</title>
<desc id="desc">Rounded folded-ribbon green and white letter N inside a broken green ring with code brackets, above NOBODY and Universal Programming Language.</desc>
<defs>
  <linearGradient id="green" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#0b9d36"/><stop offset=".48" stop-color="#51ff39"/><stop offset="1" stop-color="#e7ffe0"/></linearGradient>
  <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset=".55" stop-color="#c6ffc0"/><stop offset="1" stop-color="#40ed43"/></linearGradient>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="9"/></filter>
</defs>
<rect width="1200" height="650" fill="#050806"/>
<g fill="none" stroke="#46f43f" stroke-width="12" stroke-linecap="square" opacity=".32" filter="url(#glow)">
  <path d="M367 263 A235 235 0 0 1 822 174 M827 284 A235 235 0 0 1 427 426 M369 354 A235 235 0 0 1 359 330"/>
</g>
<g fill="none" stroke="url(#green)" stroke-width="10" stroke-linecap="square">
  <path d="M367 263 A235 235 0 0 1 822 174"/>
  <path d="M827 284 A235 235 0 0 1 427 426"/>
</g>
<path d="M320 260 L265 300 L320 340" fill="none" stroke="#62fa4b" stroke-width="12" stroke-linejoin="miter"/>
<path d="M880 260 L935 300 L880 340" fill="none" stroke="#62fa4b" stroke-width="12" stroke-linejoin="miter"/>
<path d="M852 256 L827 343" stroke="#a6ffa0" stroke-width="11"/>
<g>
  <!-- Soft ribbon N: two vertical folded ends connected by one continuous curved diagonal. -->
  <path d="M438 398 L438 218 Q438 174 476 166 Q505 159 529 182 L728 362 Q744 375 760 360 L760 182 L713 211 L713 310 L528 146 Q492 114 453 132 Q403 155 403 210 L403 368 Z" fill="#083d19" opacity=".8"/>
  <path d="M432 397 L432 221 Q432 179 468 166 Q491 158 511 176 L511 330 Q492 360 432 397 Z" fill="url(#steel)"/>
  <path d="M469 167 Q495 151 520 174 L712 349 Q741 375 766 349 L766 180 L716 215 L716 308 L527 142 Q499 119 470 132 Q450 142 442 166 Z" fill="url(#green)"/>
  <path d="M716 215 L766 180 L766 349 Q742 378 712 349 Z" fill="url(#steel)"/>
  <path d="M432 221 Q432 179 468 166 Q489 161 511 176 L511 330 L469 364 L469 218 Q469 195 485 189 Q460 180 451 214 L451 376 L432 397 Z" fill="#13b42e" opacity=".35"/>
  <path d="M470 132 Q499 119 527 142 L716 308" fill="none" stroke="#f4fff1" stroke-width="5" opacity=".8"/>
  <path d="M511 330 L511 176" fill="none" stroke="#0b8d29" stroke-width="3" opacity=".6"/>
</g>
<text x="600" y="535" fill="#f7fff8" font-family="DejaVu Sans,Arial,sans-serif" font-size="100" font-weight="700" letter-spacing="12" text-anchor="middle">NOBODY</text>
<path d="M205 587 H295 M905 587 H995" stroke="#55f447" stroke-width="3"/>
<text x="600" y="595" fill="#79f36c" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" letter-spacing="6" text-anchor="middle">UNIVERSAL PROGRAMMING LANGUAGE</text>
</svg>
