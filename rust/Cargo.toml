[package]
name = "nobody"
default-run = "nobody-rs"
version = "0.38.0"
edition = "2021"
license = "MIT"
description = "Nobody experimental Rust compiler frontend"

[lib]
name = "nobody"
path = "src/lib.rs"

[[bin]]
name = "nobody-rs"
path = "src/main.rs"

[dependencies]
# Pinned Unicode NFC checks; source identifiers are validated, never silently rewritten.
unicode-normalization = "=0.1.24"
